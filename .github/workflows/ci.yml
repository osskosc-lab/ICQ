name: ICQ-RA CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Environment manifest
        run: |
          python - <<'PY'
          import json, platform, sys
          import numpy as np
          import scipy
          print(json.dumps({
              "python": sys.version,
              "numpy": np.__version__,
              "scipy": scipy.__version__,
              "platform": platform.platform(),
          }, indent=2))
          PY

      - name: Unit tests
        run: pytest -q --maxfail=1

      - name: Frozen Phase 0A metadata audit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          cfg = json.loads(Path("configs/phase0a.json").read_text())
          assert cfg["protocol_status"] == "FROZEN_OPERATIONAL_SCOPE_L1_L3"
          assert cfg["phase0a_final_verdict"] == "B_CONDITIONALLY_SUPPORTED"
          assert cfg["core_conclusion"] == "OPERATIONALLY_USEFUL_NOT_STRUCTURALLY_IDENTIFIED"
          assert cfg["confirmatory_real_data_run_authorized"] is False
          assert cfg["qualia_claim_authorized"] is False
          assert cfg["l4_upgrade_authorized"] is False
          print("FROZEN_PHASE0A_METADATA_AUDIT: PASS")
          PY

      - name: Qualification rerun firewall
        run: |
          echo "P0A-1 through P0A-5 are frozen historical qualification evidence."
          echo "Routine CI does not rerun scientific qualification seed banks."

      - name: Frozen environment provenance audit
        run: |
          python - <<'PY'
          from pathlib import Path

          expected = {
              "numpy==2.5.2",
              "scipy==1.18.1",
              "pytest==8.4.2",
              "iniconfig==2.3.0",
              "packaging==26.3",
              "pluggy==1.6.0",
              "pygments==2.21.0",
          }

          lines = {
              line.strip()
              for line in Path("requirements-phase0a-frozen.txt").read_text().splitlines()
              if line.strip() and not line.lstrip().startswith("#")
          }
          assert lines == expected

          provenance = Path("docs/phase0a_environment_provenance.md").read_text()
          assert "86d8b801f9a1e32a3ffefcf0c404315cd3e1701c" in provenance
          assert "33964641438" in provenance
          assert "Python 3.12.14" in provenance
          assert "ARCHIVAL_REPRODUCIBILITY_HARDENED" in provenance
          assert "NOT_FULL_BITWISE_ENVIRONMENT_LOCK" in provenance

          print("FROZEN_ENVIRONMENT_PROVENANCE_AUDIT: PASS")
          PY
