name: ICQ-RA P0B-2 One-Shot Qualification

on:
  push:
    paths:
      - ".github/workflows/p0b2_once.yml"

jobs:
  p0b2:
    if: github.event.head_commit.message == 'Execute one-shot P0B-2 qualification'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Execute P0B-2 held-out INACTIVE_DIRECT Null qualification
        run: |
          python experiments/p0b2_null_qualification.py \
            --phase0b-config configs/phase0b.json \
            --execution-config configs/p0b2_execution.json \
            --out results/p0b2/p0b2_decision.json

      - name: P0B-3+ firewall
        run: |
          echo "P0B-3, P0B-4, P0B-5 are NOT AUTHORIZED and are not executed."

      - name: Upload P0B-2 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: icq-ra-p0b2-one-shot
          path: results/p0b2/
          if-no-files-found: error
